name: Mise à jour hebdomadaire

on:
  schedule:
    - cron: '7 5 * * 1'
  workflow_dispatch:

concurrency: mise-a-jour

jobs:
  registres:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Registre américain (FAA)
        run: python scripts/import_faa.py
      - name: Autres registres et base mondiale
        if: always()
        run: python scripts/import_registres.py
      - name: Informations sur les exploitants (présentation, coordonnées, photo)
        if: always()
        run: python scripts/enrichir.py --minutes 120
